<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f11"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Grid Accent -->
  <g stroke="#27272a" stroke-width="1" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Brand Badge -->
  <g transform="translate(140, 140)">
    <rect width="80" height="80" rx="20" fill="#27272a" stroke="#3f3f46" stroke-width="2"/>
    <text x="40" y="50" font-family="'JetBrains Mono', monospace" font-size="38" font-weight="600" fill="#f59e0b" text-anchor="middle" dominant-baseline="middle">⌘</text>
  </g>

  <!-- Title & Tagline -->
  <text x="250" y="195" font-family="'JetBrains Mono', monospace" font-size="52" font-weight="700" fill="#f4f4f5" letter-spacing="-1">keycraft<tspan fill="#f59e0b">.</tspan></text>
  <text x="510" y="195" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="400" fill="#71717a">laptop edition</text>

  <text x="140" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="44" font-weight="600" fill="#ffffff" letter-spacing="-0.5">
    Minimal Laptop Typing Studio
  </text>
  <text x="140" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="24" font-weight="400" fill="#a1a1aa">
    Learn touch typing, practice real-time WPM, and analyze weak keys on an interactive laptop deck.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(140, 420)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="230" height="50" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="115" y="31" font-family="'JetBrains Mono', monospace" font-size="16" fill="#fbbf24" text-anchor="middle">⚡ Real-time WPM</text>

    <!-- Pill 2 -->
    <rect x="250" y="0" width="280" height="50" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="390" y="31" font-family="'JetBrains Mono', monospace" font-size="16" fill="#fbbf24" text-anchor="middle">⌨ Laptop ANSI Deck</text>

    <!-- Pill 3 -->
    <rect x="550" y="0" width="240" height="50" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="670" y="31" font-family="'JetBrains Mono', monospace" font-size="16" fill="#fbbf24" text-anchor="middle">🔊 Scissor Audio</text>

    <!-- Pill 4 -->
    <rect x="810" y="0" width="230" height="50" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="925" y="31" font-family="'JetBrains Mono', monospace" font-size="16" fill="#fbbf24" text-anchor="middle">🎯 Weak-Key Heatmap</text>
  </g>

  <!-- URL footer -->
  <text x="140" y="540" font-family="'JetBrains Mono', monospace" font-size="20" fill="#71717a">
    https://keycraft-tawny.vercel.app
  </text>
</svg>
